<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo Operativo — Workspace Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="workspace-wrapper" style="margin-left: 0;">
          <header class="top-bar"><a href="../index.html" class="btn">← Torna alla Dashboard</a><span class="badge">Modulo Operativo</span></header>
          <main class="main-content">
            <div class="section-header"><div><h1>Titolo del Modulo Strumento</h1><p>Template base collegato ad assets/css/style.css</p></div></div>
            <div class="tool-card"><h2>Area di Lavoro Strumento</h2><p class="card-desc">Duplica questo file in modules/ per creare nuovi strumenti con salvataggio in localStorage ed export JSON/CSV.</p><div class="card-footer"><span class="meta-tag">Pronto</span><a href="../index.html" class="btn btn-primary"><span>Chiudi e torna</span></a></div></div>
          </main>
        </div>
  <div class="toast-box" id="toastBox"><span class="toast-dot"></span><span id="toastMessage">Operazione completata</span></div>
  <script>
    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      document.getElementById('toastMessage').textContent = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
    
  </script>
</body>
</html>
