<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Hub — Gestionale Personale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       1. DESIGN TOKENS & VARIABILI DI SISTEMA
       ========================================= */
    :root {
      --bg-canvas: #F3F5F0;
      --color-primary: #7C0B44;    /* Bordeaux: H1, Stato attivo, CTA primarie */
      --color-secondary: #277584;  /* Ottanio: H2, Icone, Link */
      --color-accent: #A5B14F;     /* Verde Oliva: Badge, Hover, Evidenziazione */
      --color-ink: #000000;        /* Corpo testo 10pt, Bordi focus */
      --color-border: #D2D4D0;     /* Bordi strutturali 3px */
      
      --border-width: 3px;
      --radius-card: 16px;         /* Geometria Google Material 3 */
      --radius-pill: 9999px;       /* Bottoni e Chip stile Google */
      
      --font-size-title: 14pt;
      --font-size-body: 10pt;
      
      --rail-width: 88px;
      --header-height: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--color-ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--font-size-body);
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================
       2. TIPOGRAFIA & GERARCHIA
       ========================================= */
    h1 {
      font-size: var(--font-size-title);
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.01em;
    }

    h2 {
      font-size: var(--font-size-title);
      font-weight: 700;
      color: var(--color-secondary);
      margin-bottom: 8px;
    }

    p, span, li, input, select, textarea, button, a {
      font-size: var(--font-size-body);
      color: var(--color-ink);
    }

    /* =========================================
       3. LAYOUT STILE GOOGLE WORKSPACE (RAIL + MAIN)
       ========================================= */
    .nav-rail {
      width: var(--rail-width);
      background-color: var(--bg-canvas);
      border-right: var(--border-width) solid var(--color-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border: var(--border-width) solid var(--color-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 32px;
      font-size: var(--font-size-title);
      user-select: none;
    }

    .nav-items {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 72px;
      padding: 4px;
    }

    .nav-icon-pill {
      width: 56px;
      height: 32px;
      border-radius: var(--radius-pill);
      border: var(--border-width) solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .nav-btn:hover .nav-icon-pill {
      background-color: var(--color-accent);
      border-color: var(--color-border);
    }

    .nav-btn.active .nav-icon-pill {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .nav-btn.active .nav-icon-pill svg {
      stroke: #FFFFFF;
    }

    .nav-label {
      font-weight: 600;
      font-size: 8.5pt;
    }

    .workspace-wrapper {
      margin-left: var(--rail-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top-bar {
      height: var(--header-height);
      border-bottom: var(--border-width) solid var(--color-border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      background-color: var(--bg-canvas);
      z-index: 90;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      flex: 1;
      max-width: 500px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      height: 44px;
      background-color: var(--bg-canvas);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-pill);
      padding: 0 20px 0 44px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--color-secondary);
    }

    .search-box svg {
      position: absolute;
      left: 16px;
      stroke: var(--color-secondary);
      pointer-events: none;
    }

    .btn {
      height: 40px;
      padding: 0 18px;
      border-radius: var(--radius-pill);
      border: var(--border-width) solid var(--color-border);
      background-color: var(--bg-canvas);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background-color: var(--color-accent);
      border-color: var(--color-ink);
    }

    .btn-primary {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
    }

    .btn-primary span {
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--color-secondary);
      border-color: var(--color-secondary);
    }

    /* =========================================
       4. AREA CONTENUTI & GRIGLIA MODULARE
       ========================================= */
    .main-content {
      padding: 32px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: var(--border-width) solid var(--color-border);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .chip {
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      border: var(--border-width) solid var(--color-border);
      background: var(--bg-canvas);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background-color: var(--color-accent);
    }

    .chip.active {
      background-color: var(--color-secondary);
      border-color: var(--color-secondary);
      color: #FFFFFF;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .tool-card {
      background-color: var(--bg-canvas);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease;
    }

    .tool-card:hover {
      border-color: var(--color-secondary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border: var(--border-width) solid var(--color-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge {
      background-color: var(--color-accent);
      color: var(--color-ink);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-pill);
      padding: 2px 12px;
      font-weight: 700;
      font-size: 8.5pt;
    }

    .card-desc {
      margin-bottom: 20px;
    }

    .card-footer {
      padding-top: 16px;
      border-top: var(--border-width) solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .meta-tag {
      font-weight: 600;
      color: var(--color-secondary);
    }

    /* =========================================
       5. PANNELLO LATERALE & TOAST
       ========================================= */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.25);
      z-index: 200;
      display: none;
      justify-content: flex-end;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .side-sheet {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-canvas);
      border-left: var(--border-width) solid var(--color-border);
      height: 100%;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: var(--border-width) solid var(--color-border);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: 700;
      color: var(--color-secondary);
    }

    .form-control {
      background-color: var(--bg-canvas);
      border: var(--border-width) solid var(--color-border);
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--color-primary);
    }

    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--bg-canvas);
      border: var(--border-width) solid var(--color-primary);
      border-radius: var(--radius-pill);
      padding: 12px 24px;
      font-weight: 700;
      z-index: 300;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .toast-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-accent);
      border: 2px solid var(--color-ink);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .nav-rail {
        width: 100%;
        height: 64px;
        top: auto;
        bottom: 0;
        flex-direction: row;
        border-right: none;
        border-top: var(--border-width) solid var(--color-border);
        padding: 0 12px;
        justify-content: space-around;
      }
      .brand-mark, .nav-label, #exportJsonBtn {
        display: none;
      }
      .nav-items {
        flex-direction: row;
        justify-content: space-around;
      }
      .workspace-wrapper {
        margin-left: 0;
        margin-bottom: 64px;
      }
      .top-bar {
        padding: 0 16px;
      }
      .main-content {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION RAIL (STILE GOOGLE WORKSPACE) -->
  <nav class="nav-rail" aria-label="Navigazione principale">
    <div class="brand-mark" title="Workspace Personale">W.</div>
    <div class="nav-items">
      <button class="nav-btn active" data-filter="all" title="Tutti gli strumenti">
        <div class="nav-icon-pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <span class="nav-label">Tutto</span>
      </button>

      <button class="nav-btn" data-filter="lavoro" title="Lavoro">
        <div class="nav-icon-pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        </div>
        <span class="nav-label">Lavoro</span>
      </button>

      <button class="nav-btn" data-filter="personale" title="Vita Personale">
        <div class="nav-icon-pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="nav-label">Personale</span>
      </button>

      <button class="nav-btn" data-filter="hobby" title="Hobby">
        <div class="nav-icon-pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <span class="nav-label">Hobby</span>
      </button>

      <button class="nav-btn" data-filter="info" title="Info e Risorse">
        <div class="nav-icon-pill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </div>
        <span class="nav-label">Info</span>
      </button>
    </div>
  </nav>

  <!-- AREA DI LAVORO -->
  <div class="workspace-wrapper">
    
    <!-- TOP APP BAR -->
    <header class="top-bar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="searchInput" placeholder="Cerca strumento, archivio o risorsa...">
      </div>
      <div class="top-actions">
        <button class="btn" id="exportJsonBtn" title="Scarica backup JSON">Esporta Backup</button>
        <button class="btn btn-primary" id="openDrawerBtn">
          <span>+ Nuovo Strumento</span>
        </button>
      </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="main-content">
      
      <div class="section-header">
        <div>
          <h1>Centro di Controllo Operativo</h1>
          <p>Hub personale per flussi di lavoro, utilità domestiche, progetti creativi e documentazione.</p>
        </div>
        <span class="badge" id="counterBadge">6 Strumenti attivi</span>
      </div>

      <!-- FILTER CHIPS -->
      <div class="filter-bar" role="group" aria-label="Filtra per categoria">
        <button class="chip active" data-filter="all">Tutti i moduli</button>
        <button class="chip" data-filter="lavoro">Lavoro & AI</button>
        <button class="chip" data-filter="personale">Vita Personale</button>
        <button class="chip" data-filter="hobby">Hobby & Creatività</button>
        <button class="chip" data-filter="info">Info & Guide</button>
      </div>

      <!-- GRIGLIA MODULARE STRUMENTI -->
      <section class="tools-grid" id="toolsGrid"></section>

    </main>
  </div>

  <!-- SIDE SHEET PER AGGIUNGERE NUOVI STRUMENTI -->
  <div class="drawer-overlay" id="drawerOverlay">
    <aside class="side-sheet" aria-labelledby="sheetTitle">
      <div>
        <div class="sheet-header">
          <h1 id="sheetTitle">Aggiungi Strumento</h1>
          <button class="btn" id="closeDrawerBtn" aria-label="Chiudi pannello">✕</button>
        </div>

        <form id="addToolForm">
          <div class="form-group">
            <label for="toolTitle">Nome dello Strumento</label>
            <input type="text" id="toolTitle" class="form-control" placeholder="Es. Calcolatore Preventivi" required>
          </div>

          <div class="form-group">
            <label for="toolCategory">Area di Riferimento</label>
            <select id="toolCategory" class="form-control">
              <option value="lavoro">Lavoro</option>
              <option value="personale">Vita Personale</option>
              <option value="hobby">Hobby</option>
              <option value="info">Info</option>
            </select>
          </div>

          <div class="form-group">
            <label for="toolDesc">Descrizione breve</label>
            <textarea id="toolDesc" class="form-control" rows="3" placeholder="A cosa serve questo strumento..." required></textarea>
          </div>

          <div class="form-group">
            <label for="toolStatus">Nota di stato / Etichetta</label>
            <input type="text" id="toolStatus" class="form-control" placeholder="Es. Attivo, In aggiornamento" value="Attivo">
          </div>

          <div class="form-group">
            <label for="toolUrl">Link esterno o Nome file HTML</label>
            <input type="text" id="toolUrl" class="form-control" placeholder="https://... oppure calcolatore.html" value="#">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
            <span>Salva nel Gestionale</span>
          </button>
        </form>
      </div>

      <div style="padding-top: 20px; border-top: var(--border-width) solid var(--color-border);">
        <button type="button" class="btn" id="resetDefaultBtn" style="width: 100%;">
          Ripristina schede iniziali
        </button>
      </div>
    </aside>
  </div>

  <!-- TOAST DI NOTIFICA -->
  <div class="toast-box" id="toastBox" role="status">
    <span class="toast-dot"></span>
    <span id="toastMessage">Operazione completata</span>
  </div>

  <script>
    const defaultTools = [
      {
        id: 1,
        title: "Prompt & Workflow Builder",
        category: "lavoro",
        badge: "Lavoro",
        desc: "Libreria strutturata di system prompt, template per automazioni AI e checklist di controllo qualità.",
        status: "Aggiornato: Oggi",
        url: "#"
      },
      {
        id: 2,
        title: "Gestione Attività & Preventivi",
        category: "lavoro",
        badge: "Lavoro",
        desc: "Calcolatore rapido tariffe, scadenzario consegne e modelli di preventivo pronti all'esportazione.",
        status: "Operativo",
        url: "#"
      },
      {
        id: 3,
        title: "Ripartizione Utenze & Casa",
        category: "personale",
        badge: "Personale",
        desc: "Registro condiviso bollette (luce, gas, fibra), scadenze domestiche e promemoria manutenzione.",
        status: "In pari",
        url: "#"
      },
      {
        id: 4,
        title: "Archivio Botanico & Stampa",
        category: "hobby",
        badge: "Hobby",
        desc: "Catalogo personale con generatore di layout ottimizzati per etichette termiche e schede tecniche.",
        status: "42 Schede",
        url: "#"
      },
      {
        id: 5,
        title: "Note di Viaggio & Fotografia",
        category: "hobby",
        badge: "Hobby",
        desc: "Tracce itinerari, appunti sulla luce, checklist attrezzatura e selezione progetti personali.",
        status: "Archivio 2026",
        url: "#"
      },
      {
        id: 6,
        title: "Knowledge Base & Guide",
        category: "info",
        badge: "Info",
        desc: "Dispense, link utili, manuali rapidi e documentazione tecnica di riferimento quotidiano.",
        status: "Consultazione",
        url: "#"
      }
    ];

    const categoryIcons = {
      lavoro: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#277584" stroke-width="2.2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      personale: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#277584" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      hobby: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#277584" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
      info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#277584" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };

    const categoryLabels = {
      lavoro: "Lavoro",
      personale: "Personale",
      hobby: "Hobby",
      info: "Info"
    };

    let toolsData = JSON.parse(localStorage.getItem('personalWorkspaceTools')) || [...defaultTools];
    let currentCategory = 'all';

    const toolsGrid = document.getElementById('toolsGrid');
    const searchInput = document.getElementById('searchInput');
    const counterBadge = document.getElementById('counterBadge');
    const filterButtons = document.querySelectorAll('[data-filter]');

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      document.getElementById('toastMessage').textContent = msg;
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    function renderGrid() {
      const query = searchInput.value.toLowerCase().trim();
      toolsGrid.innerHTML = '';
      let visibleCount = 0;

      toolsData.forEach(tool => {
        const matchesCategory = (currentCategory === 'all' || tool.category === currentCategory);
        const matchesSearch = tool.title.toLowerCase().includes(query) || 
                              tool.desc.toLowerCase().includes(query) ||
                              tool.badge.toLowerCase().includes(query);

        if (matchesCategory && matchesSearch) {
          visibleCount++;
          const card = document.createElement('article');
          card.className = 'tool-card';
          card.innerHTML = `
            <div>
              <div class="card-top">
                <div class="card-icon">
                  ${categoryIcons[tool.category] || categoryIcons.info}
                </div>
                <span class="badge">${tool.badge}</span>
              </div>
              <h2>${tool.title}</h2>
              <p class="card-desc">${tool.desc}</p>
            </div>
            <div class="card-footer">
              <span class="meta-tag">${tool.status}</span>
              <a href="${tool.url}" class="btn" ${tool.url.startsWith('http') ? 'target="_blank"' : ''}>Apri →</a>
            </div>
          `;
          toolsGrid.appendChild(card);
        }
      });

      counterBadge.textContent = `${visibleCount} Strument${visibleCount === 1 ? 'o' : 'i'} attiv${visibleCount === 1 ? 'o' : 'i'}`;
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategory = btn.getAttribute('data-filter');
        filterButtons.forEach(b => {
          b.classList.toggle('active', b.getAttribute('data-filter') === currentCategory);
        });
        renderGrid();
      });
    });

    searchInput.addEventListener('input', renderGrid);

    const drawerOverlay = document.getElementById('drawerOverlay');
    document.getElementById('openDrawerBtn').addEventListener('click', () => drawerOverlay.classList.add('open'));
    document.getElementById('closeDrawerBtn').addEventListener('click', () => drawerOverlay.classList.remove('open'));
    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) drawerOverlay.classList.remove('open');
    });

    document.getElementById('addToolForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const cat = document.getElementById('toolCategory').value;
      const newTool = {
        id: Date.now(),
        title: document.getElementById('toolTitle').value.trim(),
        category: cat,
        badge: categoryLabels[cat],
        desc: document.getElementById('toolDesc').value.trim(),
        status: document.getElementById('toolStatus').value.trim() || 'Attivo',
        url: document.getElementById('toolUrl').value.trim() || '#'
      };

      toolsData.unshift(newTool);
      localStorage.setItem('personalWorkspaceTools', JSON.stringify(toolsData));
      
      e.target.reset();
      drawerOverlay.classList.remove('open');
      renderGrid();
      showToast('Strumento aggiunto al gestionale!');
    });

    document.getElementById('resetDefaultBtn').addEventListener('click', () => {
      toolsData = [...defaultTools];
      localStorage.setItem('personalWorkspaceTools', JSON.stringify(toolsData));
      drawerOverlay.classList.remove('open');
      renderGrid();
      showToast('Schede iniziali ripristinate');
    });

    document.getElementById('exportJsonBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(toolsData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "backup-gestionale.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('Backup scaricato!');
    });

    renderGrid();
  </script>
</body>
</html>
